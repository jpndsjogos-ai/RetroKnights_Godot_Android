name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-${ANDROID_API_LEVEL}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" \
                     "ndk;28.0.13004108"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot
        run: |
          curl -L --fail \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o godot.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -L --fail \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o templates.tpz
          unzip -q templates.tpz -d template_unpack
          cp -R template_unpack/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Validate project
        run: |
          ./godot --headless --path . --editor --quit --check-only

      - name: Export APK
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/RetroKnights-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroKnights-Android-${{ github.sha }}
          path: build/RetroKnights-debug.apk
          if-no-files-found: error
          retention-days: 14
